<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Unicompass - نتيجة السكور</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Noto Sans Arabic', 'Plus Jakarta Sans', sans-serif;
            background-color: #0B0E14;
            color: #ECEDF6;
        }
        .glass-card {
            background: rgba(28, 32, 40, 0.6);
            backdrop-filter: blur(20px);
        }
        .score-glow {
            box-shadow: 0 0 40px rgba(133, 173, 255, 0.15);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#73757d",
                        "background": "#0b0e14",
                        "surface-container-highest": "#22262f",
                        "surface-tint": "#85adff",
                        "primary-container": "#6d9fff",
                        "on-primary": "#002c65",
                        "surface-container-low": "#10131a",
                        "surface-container-high": "#1c2028",
                        "primary": "#85adff",
                        "on-surface": "#ecedf6",
                        "secondary": "#7f98ff",
                        "tertiary": "#b7ffbc",
                        "surface-bright": "#282c36"
                    },
                    "borderRadius": {
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    }
                }
            }
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#10131A] flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/20">
<img alt="Profile" data-alt="vibrant student avatar with modern tech aesthetic, soft studio lighting, high quality 3d render style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDonTjxPEXIei-jKkVW21UbCIUgoFzsN9Dg-_nOlyxNiY0LKM5kx_t6QX0VMI3cmXSZwqVLZwWmQzA-7HE3XHsznS1zIf-yP1qsOK4G1AxXCJSNSzMZiz-GF8hjP-N3xms9UjK5y4r0X4YuuHfpXxREWxL1XsD0Mhz2NhTnV6Qps08SJZAipJnoDlgwOC839682qOZ025qFgoZEWjlIcDbWzRhnTVax6vuYXlCl23Zx-zq048Fw9HNPmLj2VdgA6U7rPP20WGkBZzF"/>
</div>
</div>
<h1 class="text-[#85ADFF] font-black tracking-tighter italic text-xl">Unicompass</h1>
<button class="text-[#85ADFF] active:scale-95 transition-transform">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Header Text -->
<div class="mb-8">
<h2 class="text-on-surface font-bold text-3xl tracking-tight mb-2">نتيجة السكور</h2>
<p class="text-on-surface-variant/80 text-lg">هذا هو سكورك النهائي. صفي الاختيارات توة!</p>
</div>
<!-- Score Dashboard - Circular Indicator -->
<div class="relative flex flex-col items-center justify-center py-12 mb-10">
<div class="relative w-64 h-64 flex items-center justify-center rounded-full bg-surface-container-low score-glow">
<!-- SVG Progress Circle -->
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-surface-container-highest" cx="128" cy="128" fill="none" r="110" stroke="currentColor" stroke-width="12"></circle>
<circle class="text-primary rounded-full" cx="128" cy="128" fill="none" r="110" stroke="currentColor" stroke-dasharray="691" stroke-dashoffset="180" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="text-center z-10">
<span class="block text-on-surface-variant text-sm font-medium tracking-widest mb-1">السكور العام (FG)</span>
<div class="text-5xl font-black text-primary tracking-tighter" dir="ltr">164.42</div>
<div class="mt-2 inline-flex items-center gap-1 px-3 py-1 bg-tertiary/10 text-tertiary rounded-full text-xs font-semibold">
<span class="material-symbols-outlined text-xs">trending_up</span>
<span>توب 5%</span>
</div>
</div>
</div>
</div>
<!-- Formula Breakdown Card -->
<div class="space-y-4 mb-8">
<div class="group bg-surface-container-low rounded-2xl overflow-hidden transition-all duration-300">
<button class="w-full flex items-center justify-between p-5 text-right">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined">analytics</span>
</div>
<div>
<p class="text-on-surface font-bold">كيفاش تحسبت؟</p>
<p class="text-on-surface-variant text-xs">فورميل الباك 2024</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">expand_more</span>
</button>
<div class="px-5 pb-5 pt-2 border-t border-surface-container-highest/30">
<div class="grid grid-cols-2 gap-4 mb-6">
<div class="p-3 rounded-xl bg-surface-container-high/50">
<span class="text-xs text-on-surface-variant block mb-1">معدل الباك</span>
<span class="text-lg font-bold text-on-surface" dir="ltr">15.82</span>
</div>
<div class="p-3 rounded-xl bg-surface-container-high/50">
<span class="text-xs text-on-surface-variant block mb-1">بونيس 7%</span>
<span class="text-lg font-bold text-tertiary" dir="ltr">+11.51</span>
</div>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">رياضيات (x2)</span>
<span class="text-on-surface font-semibold" dir="ltr">32.00</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">فيزياء (x1.5)</span>
<span class="text-on-surface font-semibold" dir="ltr">24.75</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-on-surface-variant">فرنسية/أنقليزية</span>
<span class="text-on-surface font-semibold" dir="ltr">18.50</span>
</div>
</div>
</div>
</div>
</div>
<!-- AI Recommendation Section -->
<div class="bg-gradient-to-br from-surface-container-low to-surface-container-high p-6 rounded-3xl border border-primary/10 relative overflow-hidden mb-10">
<div class="absolute -right-10 -top-10 w-32 h-32 bg-primary/10 blur-3xl rounded-full"></div>
<div class="relative z-10">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-tertiary">bolt</span>
<span class="text-tertiary text-xs font-bold tracking-widest uppercase">نصيحة الذكاء الاصطناعي</span>
</div>
<p class="text-on-surface leading-relaxed font-medium">سكورك يعطيك حظ كبير في <span class="text-primary font-bold">INSAT</span> والا <span class="text-primary font-bold">ENIT</span>. ننصحك تثبت فيهم!</p>
</div>
</div>
<!-- Main CTA -->
<div class="fixed bottom-24 left-0 w-full px-6 z-40">
<button class="w-full bg-primary text-on-primary font-bold py-5 rounded-2xl shadow-[0_8px_32px_rgba(133,173,255,0.2)] active:scale-95 transition-all flex items-center justify-center gap-3">
<span>لوجلي على فاك</span>
<span class="material-symbols-outlined">search</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full bg-[#0B0E14]/60 backdrop-blur-xl flex justify-around items-center px-4 py-3 pb-8 z-50 border-t border-[#1C2028]/15 shadow-[0_-4px_40px_rgba(28,32,40,0.15)] rounded-t-3xl">
<button class="flex flex-col items-center justify-center text-[#ECEDF6]/60 hover:text-[#85ADFF] transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">school</span>
</button>
<button class="flex flex-col items-center justify-center text-[#85ADFF] after:content-[''] after:w-1.5 after:h-1.5 after:bg-[#85ADFF] after:rounded-full after:mt-1 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">grade</span>
</button>
<button class="flex flex-col items-center justify-center text-[#ECEDF6]/60 hover:text-[#85ADFF] transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">analytics</span>
</button>
<button class="flex flex-col items-center justify-center text-[#ECEDF6]/60 hover:text-[#85ADFF] transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">explore</span>
</button>
</nav>
</body></html>
