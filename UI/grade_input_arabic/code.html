<div class="absolute top-0 left-0 p-4 opacity-10">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">calculate</span>
</div>
<p class="text-primary text-sm font-semibold mb-1 tracking-wider uppercase">سكور الـ FG توا</p>
<div class="flex items-baseline gap-2">
<span class="text-5xl font-black text-primary tracking-tighter">164.25</span>
<span class="text-tertiary font-bold flex items-center gap-1 text-sm bg-tertiary/10 px-2 py-0.5 rounded-full" dir="ltr">

                </span>
</div>
</div>

<div class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 font-bold" dir="ltr">/ 20</div>
</div>
</div>
<!-- Subject Inputs -->
<div class="group">
<label class="block text-xs font-medium text-on-surface-variant mb-1.5 mr-1">رياضيات</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-lg font-semibold text-on-surface focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-on-surface-variant/20 text-left" dir="ltr" placeholder="00.00" type="number"/>
</div>
</div>
<div class="group">
<label class="block text-xs font-medium text-on-surface-variant mb-1.5 mr-1">فيزياء</label>

</div>

<div class="group">

</div>

<div class="group">
